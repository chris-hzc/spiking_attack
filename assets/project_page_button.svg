<svg xmlns="http://www.w3.org/2000/svg" width="520" height="104" viewBox="0 0 520 104" role="img" aria-label="Project Page: interactive demo">
  <title>Project Page: interactive demo</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9a5c"/>
      <stop offset=".55" stop-color="#f07a4a"/>
      <stop offset="1" stop-color="#d9532a"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".35"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- pulsing halo -->
  <rect x="14" y="14" width="492" height="76" rx="38" fill="#f07a4a" filter="url(#glow)" opacity=".55">
    <animate attributeName="opacity" values=".35;.75;.35" dur="2.4s" repeatCount="indefinite"/>
  </rect>

  <!-- pill -->
  <rect x="12" y="12" width="496" height="80" rx="40" fill="url(#bg)"/>
  <rect x="12" y="12" width="496" height="80" rx="40" fill="url(#shine)"/>
  <rect x="12.75" y="12.75" width="494.5" height="78.5" rx="39.25" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="1.5"/>

  <!-- globe icon -->
  <g transform="translate(58 52)" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round">
    <circle r="20"/>
    <ellipse rx="8.5" ry="20"/>
    <path d="M-20 0H20M-17 -10H17M-17 10H17"/>
  </g>

  <!-- text -->
  <text x="94" y="50" fill="#ffffff" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="700" letter-spacing=".2">Project Page</text>
  <text x="95" y="74" fill="#ffffff" fill-opacity=".9" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500">Interactive demos · animations · results explorer</text>

  <!-- LIVE tag -->
  <g transform="translate(276 27)">
    <rect width="56" height="22" rx="11" fill="#ffffff" fill-opacity=".22"/>
    <circle cx="13" cy="11" r="4" fill="#ffffff">
      <animate attributeName="opacity" values="1;.25;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="22" y="15.5" fill="#ffffff" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1">LIVE</text>
  </g>

  <!-- arrow -->
  <g transform="translate(462 52)">
    <circle r="22" fill="#ffffff"/>
    <path d="M-8 0H7M1 -7L8 0L1 7" fill="none" stroke="#d9532a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <animateTransform attributeName="transform" type="translate" values="0 0;3 0;0 0" dur="1.6s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
